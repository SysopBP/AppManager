name: Sphere Android 17 Debug APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Locate Android SDK command-line tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
      - name: Install Android 17 SDK (preview channel)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 --list | grep -E "platforms;android-37|build-tools;37" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "platform-tools"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "build-tools;37.0.0"
      - name: Map Android 17 SDK platform to API 37 path
        run: |
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Verify Sphere package and branding
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK_PATH" > apk-badging.txt
          grep -F "package: name='io.github.sysopbp.sphere.debug' versionCode='452' versionName='4.2.0'" apk-badging.txt
          grep -F "application-label:'Sphere'" apk-badging.txt
      - name: Upload Sphere debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sphere-Android17-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
