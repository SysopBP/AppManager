# Modified by SysopBP, 2026-10-14: pin workflow dependencies to verified commits.
name: Install Sphere AMOLED icon resources
on:
  push:
    branches: [master]
    paths:
      - 'arts/sphere/amoled-master.png'
      - 'scripts/generate_sphere_icons.py'
      - '.github/workflows/appsphere-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install icon processing dependency
        run: python3 -m pip install --user 'Pillow>=10,<13'
      - name: Generate launcher and splash assets
        run: python3 scripts/generate_sphere_icons.py
      - name: Commit generated Sphere resources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/appsphere_splash.png
          git add app/src/main/res/mipmap-*/ic_launcher.png app/src/main/res/mipmap-*/ic_launcher_round.png
          git add app/src/main/ic_launcher-playstore.png
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Sphere AMOLED launcher and splash assets"
            git push
          fi
