name: Prepare Sphere Eclipse Core prerelease

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sphere-prerelease.yml'
      - 'docs/releases/sphere-4.2.4-preview.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sphere-4.2.4-prerelease
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 6f5df1f4bfec6e10b4f636a600ed91f93ca9fc3e
      APK_RUN: '38183759395'
      RELEASE_TAG: v4.2.4-preview.1
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned build and download APK
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$APK_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' run.json
          gh run download "$APK_RUN" --name Sphere-Android17-debug --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Sphere-4.2.4-Eclipse-Core-hotfix.apk
      - name: Verify APK identity and hotfix source
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$AAPT" dump badging dist/Sphere-4.2.4-Eclipse-Core-hotfix.apk > badging.txt
          grep -F "package: name='io.github.sysopbp.sphere.debug' versionCode='456' versionName='4.2.4'" badging.txt
          gh api "repos/$GH_REPO/contents/app/src/main/java/io/github/muntashirakon/AppManager/scanner/vt/VtHistoryActivity.java?ref=$SOURCE_SHA" --jq .content | base64 -d > history.java
          grep -F 'private void startHistoryRefresh()' history.java
          grep -F 'if (mResumed && mViewModel != null && !isFinishing() && !isDestroyed())' history.java
          grep -F 'if (mViewModel == null || mProgress == null || isFinishing() || isDestroyed())' history.java
      - name: Update existing prerelease and preserve other assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body,url,isDraft,isPrerelease > release-before.json
          mkdir existing
          gh release download "$RELEASE_TAG" --dir existing
          rm -f existing/Sphere-4.2.4-Eclipse-Core-preview.apk
          cp dist/Sphere-4.2.4-Eclipse-Core-hotfix.apk existing/
          jq -r .body release-before.json > release-body.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path("release-body.md")
          body = p.read_text().replace("Sphere-4.2.4-Eclipse-Core-preview.apk", "Sphere-4.2.4-Eclipse-Core-hotfix.apk")
          marker = "## VirusTotal history hotfix — 11 October 2026"
          body = body.split(marker, 1)[0].rstrip()
          body += """

          ## VirusTotal history hotfix — 11 October 2026

          - Fix a crash opening VirusTotal history while authentication or backend setup is pending.
          - Start periodic history refresh only after authentication initializes the screen.
          - Restart refresh when authentication completes while the activity is resumed.
          - Guard history loading and incoming file intents until initialization completes and while the activity is closing.
          - Retains the previous Root connection hotfix.
          - Published APK: 4.2.4 (456), package io.github.sysopbp.sphere.debug.
          - Source: 6f5df1f4bfec6e10b4f636a600ed91f93ca9fc3e.
          - Android 17 debug APK build passed. Device confirmation of the VirusTotal fix is pending.
          - Thanks to reckaH2281 for reporting the crash.

          Build: https://github.com/SysopBP/AppManager/actions/runs/38183759395
          """
          p.write_text(body)
          PY
          cp release-body.md existing/Sphere-4.2.4-Release-Notes.md
          (cd existing && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" existing/Sphere-4.2.4-Eclipse-Core-hotfix.apk existing/Sphere-4.2.4-Release-Notes.md existing/SHA256SUMS.txt --clobber
          gh release delete-asset "$RELEASE_TAG" Sphere-4.2.4-Eclipse-Core-preview.apk --yes
          gh release edit "$RELEASE_TAG" --title "Sphere 4.2.4 — Eclipse Core Preview Hotfix" --notes-file release-body.md
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease > release-after.json
          jq -e --slurp '.[0].isDraft == .[1].isDraft and .[0].isPrerelease == .[1].isPrerelease' release-before.json release-after.json
          cat release-after.json
