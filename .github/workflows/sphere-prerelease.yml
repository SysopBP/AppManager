name: Prepare Sphere Eclipse Core prerelease

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sphere-prerelease.yml'
      - 'docs/releases/sphere-4.2.4-preview.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sphere-4.2.4-prerelease
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 52ced6ed9487a2fd7215056be850977672e7af11
      APK_RUN: '38053334533'
      RELEASE_TAG: v4.2.4-preview.1
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned build and download APK
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$APK_RUN" > run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success"' run.json
          gh run download "$APK_RUN" --name Sphere-Android17-debug --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Sphere-4.2.4-Eclipse-Core-preview.apk
      - name: Prepare guides and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp docs/APPSPHERE_FEATURES.md dist/Sphere-4.2.4-Setup-Guide.md
          cp docs/appsphere-installer-control.md dist/Sphere-Installer-Control-Guide.md
          cp docs/releases/sphere-4.2.4-preview.md dist/Sphere-4.2.4-Release-Notes.md
          cd dist
          sha256sum *.apk *.md > SHA256SUMS.txt
      - name: Create unpublished draft prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving it without changes."
            gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$SOURCE_SHA" \
            --title "Sphere 4.2.4 — Eclipse Core Preview" \
            --notes-file docs/releases/sphere-4.2.4-preview.md \
            --draft --prerelease
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease
